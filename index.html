<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucero京都 | STARPASS デジタル会員証</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #020617;
            --lucero-navy: #06152d;
            --lucero-gold: #c5a059;
            --lucero-gold-light: #e5c583;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 16px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 360px;
            text-align: center;
            margin-bottom: 16px;
        }

        .logo-area h1 {
            font-family: 'Urbanist', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .logo-area h1 span {
            color: var(--lucero-gold);
        }

        .logo-area p {
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 3px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        main {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 1 / 1.55;
            position: relative;
            touch-action: none;
        }

        .starpass-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a192f 0%, #020813 100%);
            border: 2px solid var(--lucero-gold);
            border-radius: 20px;
            position: relative;
            padding: 26px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
            transform: rotateX(0deg) rotateY(0deg);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(195, 160, 89, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(195, 160, 89, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            mask-image: radial-gradient(circle at center, black 50%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 50%, transparent 95%);
            opacity: 0.8;
            z-index: 1;
        }

        /* クラブの透かしロゴエンブレム (CSSアートによる一番星) */
        .club-watermark {
            position: absolute;
            bottom: 12%;
            right: -5%;
            width: 180px;
            height: 180px;
            opacity: 0.06;
            z-index: 1;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .watermark-star {
            color: var(--lucero-gold);
            font-size: 160px;
        }

        .star-glow {
            position: absolute;
            top: -5%;
            right: -5%;
            width: 50%;
            height: 35%;
            background: radial-gradient(circle, rgba(195, 160, 89, 0.15) 0%, transparent 70%);
            z-index: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .card-badge {
            background: linear-gradient(90deg, var(--lucero-gold), #8e6f3e);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 1px;
        }

        .live-clock {
            font-family: 'Urbanist', sans-serif;
            font-size: 12px;
            color: var(--lucero-gold-light);
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(195, 160, 89, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 中段：顔写真レイアウト */
        .card-profile-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: auto;
            z-index: 2;
        }

        .profile-image-slot {
            width: 100px;
            height: 125px;
            border: 1.5px solid var(--lucero-gold);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .profile-image-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-image-slot i {
            font-size: 24px;
            color: var(--lucero-gold);
            margin-bottom: 4px;
        }

        .profile-image-slot span {
            font-size: 9px;
            color: var(--text-sub);
            text-align: center;
            padding: 0 4px;
        }

        #imageUploadInput {
            display: none;
        }

        .player-info-text {
            flex: 1;
        }

        .label-sub {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .player-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .meta-value {
            font-family: 'Urbanist', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(195, 160, 89, 0.2);
            padding-top: 12px;
            z-index: 2;
        }

        .pass-title {
            font-family: 'Urbanist', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--lucero-gold);
            letter-spacing: 3px;
            font-style: italic;
        }

        .club-auth {
            text-align: right;
            font-size: 9px;
            color: var(--text-sub);
            line-height: 1.3;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--lucero-gold) 0%, #a88444 100%);
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-sub);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #0f172a;
            border: 2px solid var(--lucero-gold);
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .stamp-icon {
            font-size: 44px;
            color: var(--success);
            margin-bottom: 12px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>LUCERO<span>KYOTO</span></h1>
            <p>Official Membership Pass</p>
        </div>
    </header>

    <main>
        <div class="card-container" id="cardContainer">
            <div class="starpass-card" id="starpassCard">
                <div class="grid-bg"></div>
                <div class="star-glow"></div>
                
                <div class="club-watermark">
                    <i class="fa-solid fa-star watermark-star"></i>
                </div>
                
                <div class="card-header">
                    <div class="card-badge" id="passBadge">JUNIOR YOUTH</div>
                    <div class="live-clock">
                        <div class="live-dot"></div>
                        <span id="clockSerial">00:00:00</span>
                    </div>
                </div>

                <div class="card-profile-area">
                    <div class="profile-image-slot" onclick="triggerImageUpload()" id="imageSlot">
                        <i class="fa-solid fa-camera"></i>
                        <span>タップして<br>写真を
